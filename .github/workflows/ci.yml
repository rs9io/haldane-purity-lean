name: Lean 4 & Exact Certificate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-spin1-and-verifiers:
    name: Build Spin-1 & 2D Lean 4 Modules + All Candidate A Verifiers
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache and build Spin-1 (point + interval) & 2D TFIM modules
        run: |
          set -euo pipefail
          lake exe cache get
          lake build PurityBootstrap.Spin1Interval PurityBootstrap.Ising2DGap

      - name: Verify Candidate A 88/88 thermal enclosures (pure integer/rational, stdlib only)
        run: |
          set -euo pipefail
          python3 -O scripts/verify_candidate_a_all88.py

      - name: Set up Python environment for open7 residual and 160-bit Arb L=112 trial verifiers
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy and python-flint
        run: |
          set -euo pipefail
          python -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install numpy python-flint

      - name: Verify Candidate A 7-site open-chain lower bound (exact int64 residual)
        run: |
          set -euo pipefail
          .ci-venv/bin/python -O scripts/certify_open7_shift.py

      - name: Verify Candidate A L=112 chi=32 periodic MPS trial witness (160-bit Arb)
        run: |
          set -euo pipefail
          .ci-venv/bin/python -O scripts/check_trial.py

  build-corner-certificates:
    name: Build Candidate E ${{ matrix.corner }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        corner: [Corner15_47, Corner15_48, Corner16_47, Corner16_48]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache and build ${{ matrix.corner }}
        run: |
          set -euo pipefail
          lake exe cache get
          lake build PurityBootstrap.CandidateE.${{ matrix.corner }}

      - name: Upload ${{ matrix.corner }} build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corner-${{ matrix.corner }}
          retention-days: 1
          path: |
            .lake/build/lib/lean/PurityBootstrap/CandidateE/${{ matrix.corner }}.*
            .lake/build/ir/PurityBootstrap/CandidateE/${{ matrix.corner }}.*

  full-closure-axiom-audit:
    name: Full 29-Module Build & Fail-Closed Axiom Audit
    needs: [verify-spin1-and-verifiers, build-corner-certificates]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache and build shared prerequisites
        run: |
          set -euo pipefail
          lake exe cache get
          lake build PurityBootstrap.CandidateE.Basis

      - name: Download all four verified Candidate E corner artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: corner-*
          merge-multiple: true
          path: .

      - name: Build full 29-module closure and run fail-closed axiom audit
        run: |
          set -euo pipefail
          lake build
          lake env lean scripts/check_axioms.lean
